<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d4fd7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cuentas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#15202e; --muted:#586577; --line:#d8dee8;
  --accent:#1d4fd7; --accent-ink:#ffffff; --accent-soft:#e6ecfc; --accent-2:#6f8fe8; --accent-3:#b9c8f5;
  --ok:#1b7a4b; --ok-bg:#e3f4ea; --warn:#8f5200; --warn-bg:#fff0d1; --bad:#b0231b; --bad-bg:#fde6e3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141b; --surface:#171e28; --ink:#e8edf4; --muted:#98a4b5; --line:#2a3443;
    --accent:#7b9bff; --accent-ink:#0d1420; --accent-soft:#1d2840; --accent-2:#4d6bc7; --accent-3:#2b3d6b;
    --ok:#5fd39a; --ok-bg:#12301f; --warn:#f2b45a; --warn-bg:#3a2b10; --bad:#ff8a80; --bad-bg:#3a1715;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .neg{color:var(--bad)} .pos{color:var(--ok)} .warn{color:var(--warn)}

/* estructura a pantalla completa */
.app{display:flex;width:100vw;height:100vh;height:100dvh;overflow:hidden}
.side{flex:0 0 232px;height:100%;display:flex;flex-direction:column;gap:18px;padding:max(24px,env(safe-area-inset-top)) 16px 20px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{margin:0 12px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.navi{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:500;text-align:left;text-decoration:none}
.navi[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sync{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ok);background:transparent;border:0;text-align:left}
.sync.homesync{margin-top:0}
.ver{display:block;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.sync.busy{color:var(--muted)} .sync.warn{color:var(--warn);background:var(--warn-bg)} .sync.err{color:var(--bad);background:var(--bad-bg)}
.main{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column}
.scroll{flex:1 1 0;min-height:0;overflow-y:auto;padding:28px 32px;-webkit-overflow-scrolling:touch}
.col{display:flex;flex-direction:column;gap:24px}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px;padding:12px 32px max(12px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bar .grow{margin-right:auto;color:var(--muted)}
.topbar{display:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.s{width:18px;height:18px}

/* texto */
.h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sub{margin-top:6px;font-size:16px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0}

/* piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.card>.h2{margin-bottom:12px}
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{flex:1 1 230px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.kpi .l{font-size:15px;color:var(--muted)} .kpi .v{margin:4px 0 6px;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em} .kpi .s{font-size:15px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.alt{background:transparent;color:var(--accent)} .btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px} .btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg a,.seg button{display:flex;align-items:center;min-height:48px;padding:0 22px;border:0;background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper strong{min-width:150px;text-align:center;font-size:20px}
.sq{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.zero{color:var(--muted)}
.note{padding:12px 16px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.note.ok{background:var(--ok-bg);color:var(--ok)} .note.err{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;padding:2px 10px;border-radius:6px;font-size:13px;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.tag.gray{background:var(--bg);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:15px;color:var(--muted)}
.inp,.sel{height:52px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px;font-weight:600;min-width:0}
.inp.r{text-align:right} .inp.sm,.sel.sm{height:44px;font-size:15px;font-weight:500}
.sel{appearance:auto}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row.c{align-items:center} .row.e{align-items:flex-end}
.grow1{flex:1 1 0;min-width:0}
.meter{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%}
.t th{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:2px solid var(--ink);font-size:14px;font-weight:600;color:var(--muted);background:var(--surface)}
.t td{padding:11px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:16px}
.t th.l,.t td.l{text-align:left}
.t tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.t tr.warnrow td{background:var(--warn-bg)}
.t tr.dim td{background:var(--bg);color:var(--muted)} .t tr.dim .strike{text-decoration:line-through}
.lnk{color:var(--ink);font-weight:600;text-decoration:none}
.mv{display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:6px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.mv .d{flex:none;width:64px;font-size:15px;color:var(--muted)} .mv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .mv .c{flex:none;width:150px;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .mv .a{flex:none;font-weight:700}
.empty{padding:28px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}

/* inicio */
.home{height:100%;display:flex;flex-direction:column;gap:20px;padding:max(36px,env(safe-area-inset-top)) 40px 32px;overflow-y:auto}
.home .hd{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.home .h1{font-size:44px}
.home section{flex:none;display:flex;flex-direction:column}
.home h2{margin:0 0 10px;font-size:18px;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:16px}
.tile{flex:1 1 220px;min-width:0;min-height:230px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px 26px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;text-decoration:none}
.tile .ico{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.tile .tt{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em} .tile .td{font-size:16px;color:var(--muted)}
.tile .st{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);width:100%;font-size:16px;font-weight:600}
.pill{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* nuevo mes */
.steps{display:flex;align-items:center;gap:14px}
.steps a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--muted);font-size:17px}
.steps a[aria-current="step"]{color:var(--ink);font-weight:700}
.steps .n{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700}
.steps a[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .steps a.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .ln{flex:1 1 40px;max-width:120px;height:2px;background:var(--line)}
.srcs{display:flex;flex-wrap:wrap;gap:16px}
.src{flex:1 1 220px;min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.src .nm{font-size:17px;font-weight:700} .src .ok{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ok)} .src .fs{font-size:14px;color:var(--muted)}
.src .btn{margin-top:10px;align-self:flex-start}
.picker{display:flex;flex-wrap:wrap;gap:16px}
.mtile{flex:1 1 200px;min-width:0;min-height:104px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.mtile .mn{font-size:22px;font-weight:700} .mtile .ms{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.mtile.cur{background:var(--warn-bg)} .mtile.off{opacity:.5}
.banks{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.bank{flex:1 1 400px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bank.small{flex:0 0 auto}
.bankcol{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:16px}
.bank .bh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.bank .bh h3{font-size:18px} .bank .bh span{font-size:13px;color:var(--muted)}
.bank .br{display:flex;align-items:center;gap:16px;min-height:76px;padding:10px 20px;border-bottom:1px solid var(--line)}
.bank .br:last-child{border-bottom:0}
.bank .bi{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.bank .bi b{font-size:17px} .bank .bi small{font-size:13px;color:var(--muted)} .bank .bi .prev{font-size:14px;color:var(--muted)}
.bank .br .inp{width:150px;flex:none}

/* diálogo y avisos */
dialog{border:0;border-radius:16px;padding:22px;width:min(100% - 24px,32rem);background:var(--surface);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.5)}
dialog h2{margin-bottom:14px}
dialog .field{margin-bottom:12px}
dialog .acts{display:flex;align-items:center;gap:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.setup{width:min(640px,100%);display:flex;flex-direction:column;gap:18px}
.chart{width:100%;height:auto;display:block}

@media (max-width:900px){
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:260px;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.menu .side{transform:none}
  .topbar{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .brand{margin:0;font-size:20px}
  .scroll{padding:20px 16px} .bar{padding:12px 16px}
  .home{padding:24px 16px} .h1{font-size:28px} .home .h1{font-size:34px}
  .mv .c{display:none}
}
@media (prefers-reduced-motion:reduce){.side,.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// ==CORE==
const APP_VERSION='1.1';
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MSHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const mlow=i=>MONTHS[i].toLowerCase();
const CUENTAS=['BBVA cuenta','BBVA Conjunta','Bankinter','Revolut'];
const RULES=[
  ['ferreteria','Bricolaje'],['carref','Supermercado'],['mercadona','Supermercado'],['lidl','Supermercado'],
  ['cash','Supermercado'],['expvaguad','Supermercado'],['las vaguada','Supermercado'],['guadiana','Supermercado'],
  ['digi','Telefono'],['vodafone','Telefono'],['eess','Gasoil'],['cobripin','Bricolaje'],['leroy','Bricolaje'],
  ['amazon','Amazon'],['medico','O.N.G,'],['iberdrola','Luz'],['loteria','Primitiva'],['aqualia','Agua'],
  ['decathlon','Deporte'],['farmacia','Farmacia'],['fcia','Farmacia'],['menus','Restaurantes'],['saunier','Hogar'],
  ['desayuno','Restaurantes'],['temu','Temu Aliexpres'],['aliexpres','Temu Aliexpres'],['aldi','Supermercado'],
  ['fruteria','Supermercado'],['axa','Coches'],['camp','Camping']
];
const TRASPASO_WORDS=['traspaso','transferencia','transf'];

/* ---------- utilidades ---------- */
function norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
const pad2=n=>String(n).padStart(2,'0');
const round2=n=>Math.round(n*100)/100;
const sum=a=>a.reduce((s,x)=>s+x,0);
function ymd(y,m,d){ const dt=new Date(Date.UTC(y,m-1,d)); if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d) return null; return {y,m,d}; }
const fmtDate=p=>pad2(p.d)+'/'+pad2(p.m)+'/'+p.y;
const isoStr=p=>p.y+'-'+pad2(p.m)+'-'+pad2(p.d);
const isoNum=p=>p.y*10000+p.m*100+p.d;
const ymOf=iso=>iso.slice(0,7);
const ymStr=(y,m)=>y+'-'+pad2(m);
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){ if(v>20000&&v<80000&&typeof XLSX!=='undefined'){ const p=XLSX.SSF.parse_date_code(v); if(p) return ymd(p.y,p.m,p.d); } return null; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return ymd(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})\s*[\/\-.]+\s*(\d{1,2})\s*[\/\-.]+\s*(\d{2,4})$/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; return ymd(y,+m[2],+m[1]);
}
function parseNumber(v){
  if(typeof v==='number') return isFinite(v)?v:null;
  if(v==null) return null;
  let s=String(v).replace(/[\s€\u00a0]/g,'').replace(/\u2212/g,'-'); if(!s) return null;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(',')) s=s.replace(',','.');
  const n=Number(s); return isFinite(n)?n:null;
}
const nf2=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'});
const nf0=new Intl.NumberFormat('es-ES',{maximumFractionDigits:0,useGrouping:'always'});
const nfd=new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
const eur=n=>nf2.format(n), eur0=n=>nf0.format(Math.round(n)), num2=n=>nfd.format(n);
const sgn=(n,dec=2)=>(n>=0?'+':'\u2212')+(dec?nfd.format(Math.abs(n)):nf0.format(Math.abs(n)))+'\u00a0€';
const pct1=x=>(Math.abs(x).toFixed(1)).replace('.',',')+'\u00a0%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
const dayShort=iso=>{ const p=parseDate(iso); return p?(p.d+' '+MSHORT[p.m-1].toLowerCase()):iso; };

/* ---------- clasificación ---------- */
function makeCanon(cats){
  const m=new Map(); cats.forEach(c=>m.set(c.n.trim().toLowerCase(),c.n.trim()));
  return name=>{ const l=String(name).trim().toLowerCase(); return m.get(l)||m.get(l+'s')||m.get(l.replace(/s$/,''))||null; };
}
function buildHist(pairs){
  const ex={},p2={},p1={};
  const add=(m,k,c)=>{ (m[k]=m[k]||{})[c]=((m[k]||{})[c]||0)+1; };
  for(const [c,d] of pairs){ const n=norm(d); if(!n) continue; const w=n.split(' '); add(ex,n,c); add(p1,w[0],c); if(w.length>1) add(p2,w[0]+' '+w[1],c); }
  const pack=(m,minc,uni,minlen)=>{ const o={}; for(const k in m){ if(minlen&&k.length<minlen) continue;
    const e=Object.entries(m[k]).sort((a,b)=>b[1]-a[1]); const tot=e.reduce((s,x)=>s+x[1],0); if(tot<minc) continue; if(uni&&e[0][1]!==tot) continue;
    o[k]=[e[0][0],tot,e[0][1]===tot?0:1]; } return o; };
  return {exact:pack(ex,1,false),p2:pack(p2,2,true),p1:pack(p1,2,true,4)};
}
function classify(desc,ctx){
  const n=norm(desc); if(!n) return {cat:null,src:'none'};
  if(ctx.learnCat[n]) return {cat:ctx.learnCat[n],src:'learned'};
  const toks=n.split(' ');
  for(const [kw,cat] of RULES){ const k=norm(kw); const hit=k.includes(' ')?(' '+n+' ').includes(' '+k+' '):toks.some(t=>t.startsWith(k)); if(hit){ const c=ctx.canon(cat); if(c) return {cat:c,src:'rule',note:kw}; } }
  const ex=ctx.hist.exact[n]; if(ex) return {cat:ex[0],src:ex[2]?'exact-mixed':'exact'};
  if(toks.length>1){ const key=toks[0]+' '+toks[1]; if(ctx.hist.p2[key]) return {cat:ctx.hist.p2[key][0],src:'prefix',note:key}; }
  if(ctx.hist.p1[toks[0]]) return {cat:ctx.hist.p1[toks[0]][0],src:'prefix',note:toks[0]};
  return {cat:null,src:'none'};
}
const mkKey=(iso,a,t)=>iso+'|'+Math.round(Math.abs(a)*100)+'|'+norm(t);
function applyDup(rows,existing){
  rows.forEach(r=>r.dup=null); if(!existing||!existing.length) return;
  const strict=new Map(), loose=new Map(); const inc=(m,k)=>m.set(k,(m.get(k)||0)+1), dec=(m,k)=>m.set(k,m.get(k)-1);
  for(const x of existing){ const k1=x.d+'|'+Math.round(Math.abs(x.a)*100); inc(loose,k1); inc(strict,k1+'|'+norm(x.t)); }
  for(const r of rows){ if(!r.date) continue; const k1=isoStr(r.date)+'|'+Math.round(Math.abs(r.amount)*100); const k2=k1+'|'+norm(r.desc);
    if((strict.get(k2)||0)>0){ dec(strict,k2); dec(loose,k1); r.dup='dup'; } else if((loose.get(k1)||0)>0){ dec(loose,k1); r.dup='maybe'; } }
}

const SYN={f:['fecha','f valor','date','fecha valor','fecha operacion','fecha contable'],
           c:['concepto','descripcion','detalle','movimiento','description','concepto movimiento'],
           i:['importe','cantidad','amount','importe eur','importe en eur']};
function parseBankAoa(aoa){
  let h=-1, ci=null;
  for(let r=0;r<Math.min(aoa.length,60);r++){
    const cells=(aoa[r]||[]).map(norm);
    const find=(syn)=>cells.findIndex(x=>x&&syn.some(s=>x===s||x.startsWith(s+' ')||x.startsWith(s)));
    const f=find(SYN.f), c=find(SYN.c), i=find(SYN.i);
    if(f>=0&&c>=0&&i>=0){ h=r; ci={f,c,i}; break; }
  }
  if(h<0) throw new Error('No encuentro las columnas Fecha, Concepto e Importe en este archivo.');
  const out=[];
  for(let r=h+1;r<aoa.length;r++){
    const row=aoa[r]||[]; const amt=parseNumber(row[ci.i]); if(amt==null||amt===0) continue;
    out.push({srcRow:r+1,rawDate:row[ci.f],desc:String(row[ci.c]==null?'':row[ci.c]).trim(),amount:amt});
  }
  return out;
}
// Separa gastos e ingresos. Normal: gasto = negativo. Si no hay negativos, los positivos son gastos.
function splitMovs(list){
  const neg=list.filter(x=>x.amount<0), pos=list.filter(x=>x.amount>0);
  if(neg.length) return {gastos:neg.map(x=>({...x,amount:Math.abs(x.amount)})),ingresos:pos,note:''};
  return {gastos:pos,ingresos:[],note:'Todos los importes venían en positivo: los he tratado como gastos.'};
}

// Misma función para el cambio local inmediato y para volver a aplicar lo pendiente tras recargar.
function applyOp(db,action,p){
  switch(action){
    case 'addMovs': { const have=new Set(db.movs.map(m=>m.id)); (p.filas||[]).forEach(f=>{ if(!have.has(String(f[0]))){ have.add(String(f[0])); db.movs.push({id:String(f[0]),f:String(f[1]),cu:String(f[2]||''),c:String(f[3]||''),d:String(f[4]||''),i:Number(f[5])||0,o:String(f[6]||'')}); } }); break; }
    case 'updMov': { const f=p.fila; const k=db.movs.findIndex(m=>m.id===String(f[0])); if(k>=0) db.movs[k]={id:String(f[0]),f:String(f[1]),cu:String(f[2]||''),c:String(f[3]||''),d:String(f[4]||''),i:Number(f[5])||0,o:String(f[6]||'')}; break; }
    case 'delMov': db.movs=db.movs.filter(m=>m.id!==String(p.id)); break;
    case 'setIngreso': if(Number(p.importe)) db.ingresos[p.mes]=Number(p.importe); else delete db.ingresos[p.mes]; break;
    case 'saveFoto': { const [id,f,c]=p.foto; const k=db.fotos.findIndex(x=>x.id===String(id)); const o={id:String(id),f:String(f),c:String(c)}; if(k>=0) db.fotos[k]=o; else db.fotos.push(o);
      db.fv=db.fv.filter(x=>x.foto!==String(id)); (p.valores||[]).forEach(v=>db.fv.push({foto:String(id),p:String(v[0]),v:Number(v[1])})); break; }
    case 'delFoto': db.fotos=db.fotos.filter(x=>x.id!==String(p.id)); db.fv=db.fv.filter(x=>x.foto!==String(p.id)); break;
    case 'savePos': { const f=p.fila; const o={id:String(f[0]),n:String(f[1]),b:String(f[2]||''),g:String(f[3]||''),t:String(f[4]||''),o:Number(f[5])||0,desde:String(f[6]||''),hasta:String(f[7]||'')}; const k=db.pos.findIndex(x=>x.id===o.id); if(k>=0) db.pos[k]=o; else db.pos.push(o); break; }
    case 'saveLearn': (p.items||[]).forEach(it=>{ db.learn=db.learn.filter(x=>!(x.pat===String(it[0])&&x.tipo===String(it[1]))); if(it[2]!==''&&it[2]!=null) db.learn.push({pat:String(it[0]),tipo:String(it[1]),val:String(it[2])}); }); break;
    case 'addCat': { const f=p.fila; const k=db.cats.findIndex(c=>c.k===String(f[0])); const o={k:String(f[0]),n:String(f[1]),a:String(f[2])!=='0'}; if(k>=0) db.cats[k]=o; else db.cats.push(o); break; }
    case 'setCfg': db.cfg[p.clave]=String(p.valor); break;
  }
}

function aggYear(movs,year){
  const by=new Map(), tot=Array(12).fill(0), pre=year+'-';
  for(const r of movs){ if(!r.f.startsWith(pre)) continue; const m=+r.f.slice(5,7)-1, k=r.c||''; if(!by.has(k)) by.set(k,Array(12).fill(0)); by.get(k)[m]+=r.i; tot[m]+=r.i; }
  for(const [k,a] of by) by.set(k,a.map(round2));
  return {by,tot:tot.map(round2)};
}
function orderedCats(by,cats,sortBy){
  const names=cats.map(c=>c.n); const extra=[...by.keys()].filter(k=>k&&!names.includes(k));
  let list=[...names,...extra].filter(k=>by.has(k)&&sum(by.get(k))!==0);
  if(sortBy==='total') list.sort((a,b)=>sum(by.get(b))-sum(by.get(a)));
  if(by.has('')&&sum(by.get(''))!==0) list.push('');
  return list;
}
// Patrimonio: una foto = día en que se toman los saldos; cierra el mes anterior.
// Lo que no se actualiza en una foto se arrastra del último valor; las posiciones cerradas dejan de contar.
function patCalc(db){
  const photos=[...db.fotos].sort((a,b)=>a.f.localeCompare(b.f)||a.id.localeCompare(b.id));
  const fvBy={}; db.fv.forEach(x=>{ (fvBy[x.foto]=fvBy[x.foto]||{})[x.p]=x.v; });
  const out=[];
  photos.forEach((ph,idx)=>{
    const active=db.pos.filter(p=>(!p.desde||p.desde<=ph.f)&&(!p.hasta||ph.f<=p.hasta));
    const vals={}; let total=0, real=0;
    active.forEach(p=>{
      let v=null, isReal=false;
      if(fvBy[ph.id]&&fvBy[ph.id][p.id]!==undefined){ v=fvBy[ph.id][p.id]; isReal=true; }
      else for(let j=idx-1;j>=0;j--){ const m=fvBy[photos[j].id]; if(m&&m[p.id]!==undefined){ v=m[p.id]; break; } }
      if(v===null) v=0; vals[p.id]={v,real:isReal,since:isReal?ph.f:null}; total+=v; if(isReal) real++;
    });
    out.push({id:ph.id,f:ph.f,c:ph.c,total:round2(total),real,count:active.length,vals,active});
  });
  return out;
}
function lastReal(pc,posId,uptoIdx){ for(let j=uptoIdx;j>=0;j--){ const x=pc[j].vals[posId]; if(x&&x.real) return {v:x.v,f:pc[j].f}; } return null; }
function prevMonthYM(today){ const d=parseDate(today); let y=d.y,m=d.m-1; if(m<1){ m=12; y--; } return ymStr(y,m); }
function addMonths(ym,n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+n; while(m<1){ m+=12; y--; } while(m>12){ m-=12; y++; } return ymStr(y,m); }

async function api(action,payload,timeoutMs=60000){
  if(!S.cfg) throw new Error('Falta configurar la conexión.');
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),timeoutMs);
  try{
    const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:S.cfg.key,action},payload||{})),signal:ctl.signal,redirect:'follow'});
    const txt=await r.text(); let j;
    try{ j=JSON.parse(txt); }catch(e){ const er=new Error('El script no devolvió datos válidos. Comprueba que está implementado como "Aplicación web" con acceso para "Cualquier persona".'); er.code='formato'; throw er; }
    if(!j.ok){ const er=new Error(j.mensaje||j.error||'Error'); er.code=j.error; throw er; }

  } finally { clearTimeout(t); }
}

/* --- indicador de estado --- */
function setSync(state,msg){
  if(state) S.sync.state=state;
  if(msg!==undefined) S.sync.msg=msg;
  const n=S.outbox.length;
  let txt='Todo guardado', cls='sync', ico='check';
  if(S.sync.state==='busy'){ txt=n?`Guardando… (${n})`:'Sincronizando…'; cls='sync busy'; ico='sync'; }
  else if(S.sync.state==='warn'){ txt=S.sync.msg||`Sin conexión: ${n} pendientes`; cls='sync warn'; ico='warn'; }
  else if(S.sync.state==='err'){ txt=S.sync.msg||'Error al guardar'; cls='sync err'; ico='warn'; }
  else if(n){ txt=`${n} cambios pendientes`; cls='sync warn'; ico='warn'; }
  S.sync.txt=txt; S.sync.cls=cls; S.sync.ico=ico;
  document.querySelectorAll('[data-sync]').forEach(el=>{ el.className=cls+(el.dataset.sync==='home'?' homesync':''); el.innerHTML=(typeof icon==='function'?icon(ico,'s'):'')+'<span>'+esc(txt)+'</span>'; });
}

/* --- enviar cambios --- */
let flushing=false, retryT=null;
function scheduleRetry(ms=8000){ clearTimeout(retryT); retryT=setTimeout(()=>flush(),ms); }
async function flush(){
  if(flushing||!S.cfg) return;
  if(!S.outbox.length){ setSync('ok',''); return; }
  flushing=true; setSync('busy','');
  try{
    while(S.outbox.length){
      const op=S.outbox[0];
      await api(op.action,op.payload);
      S.outbox.shift(); saveOutbox(); setSync('busy','');
    }
    S.sync.last=Date.now(); setSync('ok','');
  }catch(e){
    if(e.code==='clave') setSync('err','La clave no es correcta. Revísala en Datos.');
    else if(isOffline(e)){ setSync('warn',`Sin conexión: ${S.outbox.length} pendientes`); scheduleRetry(); }
    else { if(S.outbox[0]) S.outbox[0].tries=(S.outbox[0].tries||0)+1; saveOutbox(); setSync('err','No se pudo guardar: '+e.message); scheduleRetry(30000); }
  } finally { flushing=false; }
}
// Cambio con efecto inmediato: se ve al instante y se manda a la hoja en segundo plano. Nada se pisa.
function commit(action,payload){
  applyOp(S.db,action,payload); saveDBLocal();
  S.outbox.push({id:uid(),action,payload,ts:Date.now()}); saveOutbox();
  setSync(); flush();
}

/* --- traer datos de la hoja --- */
async function pull(){
  if(!S.cfg) return false;
  setSync('busy','Cargando…');
  try{
    const j=await api('load',{});
    const db=fromServer(j.datos);
    S.outbox.forEach(op=>applyOp(db,op.action,op.payload));   // lo pendiente se vuelve a aplicar encima
    S.db=db; S.sync.version=j.version||''; S.sync.last=Date.now(); saveDBLocal();
    if(S.outbox.length){ setSync('busy',''); flush(); } else setSync('ok','');
    return true;
  }catch(e){
    if(e.code==='clave') setSync('err','La clave no es correcta. Revísala en Datos.');
    else if(isOffline(e)) setSync('warn',S.db?'Sin conexión: se muestran los últimos datos guardados':'Sin conexión');
    else setSync('err','No se pudo cargar: '+e.message);
    return false;
  }
}

function monthStatus(){
  const prev=prevMonthYM(todayISO()), y=+prev.slice(0,4), have=new Set(S.db.movs.map(m=>ymOf(m.f)));
  for(let m=1;m<=+prev.slice(5,7);m++){ const ym=ymStr(y,m); if(!have.has(ym)) return {pending:ym}; }
  return {pending:null,last:prev};
}
function topConcept(year){
  const ag=aggYear(S.db.movs,year); let best=null; for(const [k,a] of ag.by) if(k){ const t=sum(a); if(!best||t>best[1]) best=[k,t]; } return best;
}

/* ================= nuevo mes ================= */
function wizInit(ym){
  const ms=monthStatus(); ym=ym||ms.pending||prevMonthYM(todayISO());
  const prevInc=S.db.ingresos[ym]||S.db.ingresos[addMonths(ym,-1)]||'';
  S.wiz={ym,sources:{},msgs:{},userCat:{},userQ:{},rows:[],ingreso:prevInc?num2(prevInc):'',fecha:fmtDate(parseDate(todayISO())),skip:false,vals:{},pickYear:+ym.slice(0,4)};
}
function makeCtx(){
  const learnCat={}; S.db.learn.filter(l=>l.tipo==='cat').forEach(l=>{ learnCat[l.pat]=l.val; });
  return {learnCat,hist:buildHist(S.db.movs.filter(m=>m.c).map(m=>[m.c,m.d])),canon:makeCanon(S.db.cats)};
}
const dayDiff=(a,b)=>Math.round((Date.UTC(a.y,a.m-1,a.d)-Date.UTC(b.y,b.m-1,b.d))/86400000);
function wizRebuild(){
  const W=S.wiz, ctx=makeCtx(), wy=+W.ym.slice(0,4), wm=+W.ym.slice(5,7);
  const learnT=new Set(S.db.learn.filter(l=>l.tipo==='traspaso'&&l.val).map(l=>l.pat));
  const rows=[], inflows=[];
  for(const [cuenta,src] of Object.entries(W.sources)){
    src.gastos.forEach((g,k)=>rows.push({id:cuenta+'#'+k,cuenta,srcRow:g.srcRow,desc:g.desc,amount:round2(g.amount),rawDate:g.rawDate,ord:src.gastos.length-1-k}));
    src.ingresos.forEach(g=>inflows.push({cuenta,amount:round2(g.amount),date:parseDate(g.rawDate)}));
  }
  rows.forEach(r=>{
    let p=parseDate(r.rawDate); r.dateNote='';
    if(p&&p.y!==wy){ const old=p.y, q=ymd(wy,p.m,p.d); if(q){ p=q; r.dateNote=`Año corregido de ${old} a ${wy}.`; } }
    r.date=p; r.dateStr=p?fmtDate(p):String(r.rawDate||''); if(!p) r.dateNote='Fecha no válida.';
    r.out=!!p&&!(p.y===wy&&p.m===wm);
    const c=classify(r.desc,ctx); r.cat=W.userCat[r.id]!==undefined?W.userCat[r.id]:c.cat; r.src=c.src; r.note=c.note||'';
    const n=norm(r.desc); r.auto='';
    if(learnT.has(n)) r.auto='lo marcaste como traspaso otras veces';
    else if(n.split(' ').some(t=>TRASPASO_WORDS.some(w=>t.startsWith(w)))) r.auto='la descripción dice traspaso o transferencia';
    else if(r.date){ const hit=inflows.find(f=>f.cuenta!==r.cuenta&&f.date&&Math.round(f.amount*100)===Math.round(r.amount*100)&&Math.abs(dayDiff(f.date,r.date))<=3); if(hit) r.auto='coincide con un ingreso de '+hit.cuenta; }
  });
  rows.sort((a,b)=>(a.date?isoNum(a.date):99999999)-(b.date?isoNum(b.date):99999999)||a.cuenta.localeCompare(b.cuenta)||a.ord-b.ord);
  applyDup(rows,S.db.movs.map(m=>({d:m.f,a:m.i,t:m.d})));
  rows.forEach(r=>{ r.quitar=W.userQ[r.id]!==undefined?W.userQ[r.id]:!!(r.auto||r.dup==='dup'||r.out); });
  W.rows=rows;
}
function wizTotals(){ const inc=S.wiz.rows.filter(r=>!r.quitar&&r.date); return {n:inc.length,total:round2(sum(inc.map(r=>r.amount))),quitadas:S.wiz.rows.filter(r=>r.quitar).length,traspasos:S.wiz.rows.filter(r=>r.quitar&&r.auto)}; }

/* ----- saldos (paso 2 y pantalla Nueva foto) ----- */
function draftCalc(d){
  const p=parseDate(d.fecha), iso=p?isoStr(p):null, pc=patCalc(S.db), rows=[];
  if(!iso) return {iso:null,rows:[],total:0,upd:0,count:0};
  const active=S.db.pos.filter(x=>(!x.desde||x.desde<=iso)&&(!x.hasta||iso<=x.hasta)).sort((a,b)=>a.o-b.o);
  let total=0, upd=0;
  active.forEach(ps=>{
    let prev=null; for(let j=pc.length-1;j>=0;j--){ if(pc[j].f<iso){ const x=pc[j].vals[ps.id]; if(x&&x.real){ prev={v:x.v,f:pc[j].f}; break; } } }
    // si no hay valor real anterior, usar el último real de cualquier foto previa
    const raw=(d.vals[ps.id]||'').trim(), typed=raw===''?null:parseNumber(raw);
    const val=typed!=null?typed:(prev?prev.v:0); if(typed!=null) upd++; total+=val;
    rows.push({pos:ps,prev,typed,val,delta:typed!=null&&prev?round2(typed-prev.v):null});
  });
  return {iso,rows,total:round2(total),upd,count:active.length};
}
function bankCards(d,scope){

  const order=['BBVA','Bankinter','Revolut','N26']; banks.sort((a,b)=>(order.indexOf(a.b)<0?99:order.indexOf(a.b))-(order.indexOf(b.b)<0?99:order.indexOf(b.b)));
  const card_=(g,small)=>{ const n=g.rows.filter(r=>r.typed!=null).length;
    return `<section class="bank ${small?'small':''}"><div class="bh"><div><h3>${esc(g.b)}</h3><span>${n} de ${g.rows.length} con valor nuevo</span></div><button class="btn alt sm" data-act="captura">${icon('up','s')}Subir captura</button></div>`
     +g.rows.map(r=>{ const prevTxt=r.prev?`Antes ${num2(r.prev.v)}${r.delta!=null?` · <span class="${r.delta>=0?'pos':'neg'}" style="font-weight:600">${sgn(r.delta)}</span>`:''}`:'Sin valor anterior';
        const tag=r.typed==null&&r.prev?`<span class="tag">Sin cambios desde ${dayShort(r.prev.f)}</span>`:'';
        return `<label class="br"><span class="bi"><b>${esc(r.pos.n)}</b><small>${esc(r.pos.t||r.pos.g)}</small><span class="prev">${r.typed!=null?prevTxt:''}</span>${tag}</span><input class="inp r" inputmode="decimal" autocomplete="off" data-chg="${scope}val" data-pos="${esc(r.pos.id)}" value="${esc(d.vals[r.pos.id]||'')}" placeholder="${r.prev?num2(r.prev.v):'0,00'}" aria-label="Valor de ${esc(r.pos.n)}"></label>`; }).join('')+`</section>`; };
  if(banks.length>1){ const [first,...rest]=banks; return `<div class="banks">${card_(first)}<div class="bankcol">${rest.map(g=>card_(g,true)).join('')}</div></div>`; }
  return `<div class="banks">${banks.map(g=>card_(g)).join('')}</div>`;
}

async function wizFile(cuenta,file){
  const W=S.wiz, ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'||file.type==='application/pdf'||(file.type||'').startsWith('image/')||['png','jpg','jpeg','heic','webp'].includes(ext)){
    W.msgs[cuenta]='Los PDF y las fotos todavía no se leen. Pásame el archivo en el chat y lo convierto a Excel.'; render(); toast('PDF y fotos: todavía no se leen. Pásamelo en el chat y lo convierto a Excel.'); return; }
  try{
    const toAoa=wb=>XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
    let aoa;
    if(ext==='csv'){ const txt=await file.text(); aoa=toAoa(XLSX.read(txt,{type:'string'})); try{ parseBankAoa(aoa); }catch(e){ aoa=toAoa(XLSX.read(txt,{type:'string',FS:';'})); } }
    else aoa=toAoa(XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'}));
    const list=parseBankAoa(aoa); if(!list.length) throw new Error('No hay movimientos en el archivo.');
    const sp=splitMovs(list); W.sources[cuenta]={file:file.name,gastos:sp.gastos,ingresos:sp.ingresos,note:sp.note}; delete W.msgs[cuenta];
    Object.keys(W.userQ).concat(Object.keys(W.userCat)).forEach(k=>{ if(k.startsWith(cuenta+'#')){ delete W.userQ[k]; delete W.userCat[k]; } });
    wizRebuild(); render(); toast(`${sp.gastos.length} gastos leídos de ${cuenta}`);
  }catch(e){ W.msgs[cuenta]='No he podido leer este archivo: '+e.message; render(); }
}
function wizSave(mode){
  const W=S.wiz, T=wizTotals(), inc=W.rows.filter(r=>!r.quitar&&r.date);
  if(inc.some(r=>r.out)){ toast('Hay gastos fuera del mes marcados para guardar. Revísalos en el paso 1.'); return; }
  const filas=inc.map(r=>movRow({id:uid(),f:isoStr(r.date),cu:r.cuenta,c:r.cat||'',d:r.desc,i:r.amount,o:'extracto'}));
  if(filas.length) commit('addMovs',{filas});
  const ing=parseNumber(W.ingreso); if(ing&&ing>0) commit('setIngreso',{mes:W.ym,importe:round2(ing)});
  let foto=false;
  if(mode==='todo'&&!W.skip){ const c=draftCalc(W); const valores=c.rows.filter(r=>r.typed!=null).map(r=>[r.pos.id,r.typed]); if(c.iso&&valores.length){ commit('saveFoto',{foto:['f'+uid(),c.iso,W.ym],valores}); foto=true; } }
  const items=[];
  W.rows.forEach(r=>{ const n=norm(r.desc); if(!n) return;
    if(W.userCat[r.id]!==undefined&&W.userCat[r.id]) items.push([n,'cat',W.userCat[r.id]]);
    if(W.userQ[r.id]===true&&!r.auto&&r.dup!=='dup'&&!r.out) items.push([n,'traspaso','1']);
    if(W.userQ[r.id]===false&&r.auto) items.push([n,'traspaso','']); });
  if(items.length) commit('saveLearn',{items});
  S.wiz=null; go('inicio'); toast(`Guardado: ${filas.length} gastos${foto?' y la foto de saldos':''}.`);
}

function filteredMovs(){
  const q=norm(S.f.q), pre=S.year+'-'; let rows=S.db.movs.filter(r=>r.f.startsWith(pre));
  if(S.f.month) rows=rows.filter(r=>+r.f.slice(5,7)===S.f.month);
  if(S.f.cat==='__none__') rows=rows.filter(r=>!r.c); else if(S.f.cat) rows=rows.filter(r=>r.c===S.f.cat);
  if(q) rows=rows.filter(r=>norm(r.d).includes(q)||norm(r.c).includes(q)||norm(r.cu).includes(q));
  return rows.sort((a,b)=>b.f.localeCompare(a.f)||b.id.localeCompare(a.id));
}

async function restoreBackup(file){
  try{
    const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'}), rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).slice(1).filter(r=>r.some(c=>c!=='')):null;
    const M=rows('Movimientos'); if(!M) throw new Error('No parece una copia de Cuentas (falta la hoja Movimientos).');
    const iso=v=>{ const p=parseDate(v); return p?isoStr(p):String(v); };
    const filas=M.map(r=>[String(r[0]),iso(r[1]),String(r[2]),String(r[3]),String(r[4]),Number(r[5])||0,String(r[6]),'']).filter(r=>r[0]);
    for(let i=0;i<filas.length;i+=400) commit('addMovs',{filas:filas.slice(i,i+400)});
    (rows('Ingresos')||[]).forEach(r=>commit('setIngreso',{mes:String(r[0]).slice(0,7),importe:Number(r[1])||0}));
    (rows('Categorias')||[]).forEach(r=>commit('addCat',{fila:[String(r[0]),String(r[1]),String(r[2]||'1')]}));
    (rows('Posiciones')||[]).forEach(r=>commit('savePos',{fila:[String(r[0]),String(r[1]),String(r[2]),String(r[3]),String(r[4]),Number(r[5])||0,String(r[6]||''),String(r[7]||'')]}));
    const F=rows('Fotos')||[], V=rows('FotosValores')||[];
    F.forEach(r=>{ const id=String(r[0]); commit('saveFoto',{foto:[id,iso(r[1]),String(r[2]).slice(0,7)],valores:V.filter(v=>String(v[0])===id).map(v=>[String(v[1]),Number(v[2])||0])}); });
    const L=(rows('Aprendizaje')||[]).map(r=>[String(r[0]),String(r[1]),String(r[2])]); if(L.length) commit('saveLearn',{items:L});
    render(); toast(`Copia cargada: ${filas.length} movimientos revisados.`);
  }catch(e){ toast('No se pudo cargar la copia: '+e.message); }
}

  const id=$('#e-id').value, f=$('#e-date').value, a=parseNumber($('#e-amt').value), d=$('#e-txt').value.trim(), c=$('#e-cat').value, cu=$('#e-cu').value;
  if(!parseDate(f)) return entryErr('Pon una fecha válida.'); if(a==null||a===0) return entryErr('Pon un importe, por ejemplo 12,50.');
  const m={id:id||uid(),f,cu,c,d,i:round2(a),o:id?(S.db.movs.find(x=>x.id===id)||{}).o||'manual':'manual'};
  if(id) commit('updMov',{fila:movRow(m)}); else commit('addMovs',{filas:[movRow(m)]});
  if(c&&norm(d)) commit('saveLearn',{items:[[norm(d),'cat',c]]});
  closeDlg(); S.year=+f.slice(0,4); render(); toast(id?'Cambios guardados':'Gasto apuntado');
}
function openIncome(i){ const ym=ymStr(S.year,i+1), v=S.db.ingresos[ym]||''; S.incYM=ym;
  openDlg(`<h2 class="h2">Ingresos de ${MONTHS[i].toLowerCase()} ${S.year}</h2><div class="field"><label for="i-val">Importe total del mes (€)</label><input id="i-val" class="inp r" inputmode="decimal" placeholder="0,00" value="${v?esc(num2(v)):''}"></div><p class="note err" id="e-err" hidden></p><div class="acts"><span style="flex:1"></span><button class="btn alt" data-act="dclose">Cancelar</button><button class="btn" data-act="i-save">Guardar</button></div>`); setTimeout(()=>{ const e=$('#i-val'); if(e) e.focus(); },60); }
function saveIncome(){ const raw=$('#i-val').value.trim(), v=raw===''?0:parseNumber(raw); if(v==null||v<0) return entryErr('Pon un importe válido.'); commit('setIngreso',{mes:S.incYM,importe:round2(v)}); closeDlg(); render(); toast('Ingresos guardados'); }
function openPos(id){
  const p=id?S.db.pos.find(x=>x.id===id):null; S.posEdit=id||null; const banks=[...new Set(['BBVA','Bankinter','Revolut','N26',...S.db.pos.map(x=>x.b)].filter(Boolean))];
  openDlg(`<h2 class="h2">Añadir posición</h2><div class="field"><label for="p-n">Nombre</label><input id="p-n" class="inp" style="font-weight:500" placeholder="Por ejemplo: Fondo Indexado"></div>
   <div class="row"><div class="field grow1"><label for="p-b">Banco</label><input id="p-b" class="inp" style="font-weight:500" list="p-bl" value="BBVA"><datalist id="p-bl">${banks.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></div><div class="field grow1"><label for="p-g">Grupo</label><select id="p-g" class="sel" style="font-weight:500">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div></div>
   <p class="note err" id="e-err" hidden></p><div class="acts"><span style="flex:1"></span><button class="btn alt" data-act="dclose">Cancelar</button><button class="btn" data-act="p-save">Añadir</button></div>`); }
function savePosNew(){
  const n=$('#p-n').value.trim(), b=$('#p-b').value.trim(), g=$('#p-g').value; if(!n) return entryErr('Escribe un nombre.'); if(S.db.pos.some(p=>p.n.toLowerCase()===n.toLowerCase())) return entryErr('Ya hay una posición con ese nombre.');
  const o=Math.max(0,...S.db.pos.map(p=>p.o))+1, t=g==='Metálico'?'Cuenta':g==='Acciones'?'Acciones':'Fondo';
  commit('savePos',{fila:['p'+uid(),n,b,g,t,o,'','']}); closeDlg(); render(); toast('Posición añadida');
}
function openClose(id){ const p=S.db.pos.find(x=>x.id===id); const pc=patCalc(S.db); const last=pc.length?pc[pc.length-1].f:todayISO(); S.posEdit=id;
  openDlg(`<h2 class="h2">Archivar ${esc(p.n)}</h2><p class="muted" style="margin-bottom:12px">Dejará de contar en las fotos posteriores a la fecha que elijas. Su historia se conserva.</p><div class="field"><label for="p-h">Último día que cuenta</label><input id="p-h" class="inp" type="date" value="${esc(last)}"></div><p class="note err" id="e-err" hidden></p><div class="acts"><span style="flex:1"></span><button class="btn alt" data-act="dclose">Cancelar</button><button class="btn" data-act="pc-save">Archivar</button></div>`); }
function savePosClose(reopen){ const p=S.db.pos.find(x=>x.id===S.posEdit); if(!p) return; let h=''; if(!reopen){ h=$('#p-h').value; if(!parseDate(h)) return entryErr('Pon una fecha válida.'); }
  commit('savePos',{fila:[p.id,p.n,p.b,p.g,p.t,p.o,p.desde,h]}); closeDlg(); render(); toast(reopen?'Posición reactivada':'Posición archivada'); }

const VIEWS={inicio:inicioView,nuevo:nuevoView,mes:elegirMesView,gasto:gastoView,anio:anioView,movs:movsView,pat:patView,foto:fotoView,datos:datosView};

/* ================= eventos ================= */
const ACT={
  menu(){ document.body.classList.toggle('menu'); },
  add(){ openEntry(null); }, edit(el){ openEntry(el.dataset.id); }, dclose(){ closeDlg(); },
  'e-save'(){ saveEntry(); }, 'i-save'(){ saveIncome(); }, 'p-save'(){ savePosNew(); }, 'pc-save'(){ savePosClose(false); },
  'e-del'(){ const a=$('.acts'); a.innerHTML='<span style="flex:1"></span><span style="margin-right:8px">¿Borrar este gasto?</span><button class="btn alt" data-act="dclose">No</button><button class="btn danger" data-act="e-del-yes">Sí, borrar</button>'; },
  'e-del-yes'(){ commit('delMov',{id:$('#e-id').value}); closeDlg(); render(); toast('Gasto borrado'); },
  yprev(){ S.year--; S.gc.month=null; render(); }, ynext(){ S.year++; S.gc.month=null; render(); },
  sort(){ S.sort=S.sort==='total'?'orden':'total'; render(); },
  income(el){ openIncome(+el.dataset.m); },
  more(){ S.f.limit+=80; $('#movlist').innerHTML=movListHTML(); },
  gcpick(el){ S.gc.concept=el.dataset.c; if(el.tagName==='BUTTON') render(); },
  gcmovs(el){ S.f={q:'',cat:el.dataset.c,month:0,limit:80}; go('movs'); },
  gcmonth(el){ S.gc.month=+el.dataset.m; render(); },
  gcmonthgo(el){ S.gc.month=+el.dataset.m; go('gasto/mes'); },
  gcprev(){ const ag=aggYear(S.db.movs,S.year); let m=(S.gc.month!=null?S.gc.month:lastMonthIdx(ag.tot))-1; if(m<0){ m=11; S.year--; } S.gc.month=m; render(); },
  gcnext(){ const ag=aggYear(S.db.movs,S.year); let m=(S.gc.month!=null?S.gc.month:lastMonthIdx(ag.tot))+1; if(m>11){ m=0; S.year++; } S.gc.month=m; render(); },
  pyprev(){ S.wiz.pickYear--; render(); }, pynext(){ S.wiz.pickYear++; render(); },
  pickmonth(el){ const keep=S.wiz; wizInit(el.dataset.ym); go('nuevo/1'); },
  wizsave(el){ wizSave(el.dataset.mode); },
  fotosave(){ fotoSave(); },
  captura(){ toast('Leer capturas todavía no está disponible. Escribe los valores, o pásame la captura en el chat.'); },
  connect(){ connect(); },
  retry(){ pull().then(()=>render(true)); },
  reconf(){ S.cfgDraft={url:S.cfg?S.cfg.url:''}; S.cfg=null; LS.del('cfg'); render(true); },
  resync(){ flush().then(()=>pull()).then(()=>{ render(); toast('Sincronizado'); }); },
  dropoutbox(){ S.outbox=[]; saveOutbox(); pull().then(()=>{ render(); toast('Pendientes descartados'); }); },
  export(){ exportExcel(); },
  addcat(){ const n=$('#ncn').value.trim(), k=$('#nck').value.trim().toUpperCase(), e=$('#ncerr'); const bad=m=>{ e.textContent=m; e.hidden=false; };
    if(!n||!k) return bad('Escribe el nombre y una letra.'); if(S.db.cats.some(c=>c.n.toLowerCase()===n.toLowerCase())) return bad('Ya existe una categoría con ese nombre.'); if(S.db.cats.some(c=>c.k===k+'=')) return bad('Esa letra ya está en uso.');
    commit('addCat',{fila:[k+'=',n,'1']}); render(); toast('Categoría añadida'); },
  posadd(){ openPos(null); }, posclose(el){ openClose(el.dataset.id); }, posreopen(el){ S.posEdit=el.dataset.id; savePosClose(true); }
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g&&!e.target.closest('[data-act]')){ go(g.dataset.go); return; }
  const el=e.target.closest('[data-act]'); if(!el) return; const h=ACT[el.dataset.act]; if(h) h(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]'); if(!el) return; const k=el.dataset.chg;
  if(k==='wizfile'){ const f=el.files[0]; if(f) wizFile(el.dataset.cuenta,f); el.value=''; return; }
  if(k==='restore'){ const f=el.files[0]; if(f) restoreBackup(f); el.value=''; return; }
  if(k==='wizq'){ S.wiz.userQ[el.dataset.id]=el.checked; wizRebuild(); render(); return; }
  if(k==='wizcat'){ S.wiz.userCat[el.dataset.id]=el.value; wizRebuild(); render(); return; }
  if(k==='wizskip'){ S.wiz.skip=el.checked; render(); return; }
  if(k==='wizfecha'){ S.wiz.fecha=el.value.trim(); render(); return; }
  if(k==='wizing'){ const v=parseNumber(el.value); S.wiz.ingreso=el.value.trim()===''?'':(v==null?el.value:num2(v)); render(); return; }
  if(k==='wizval'){ S.wiz.vals[el.dataset.pos]=el.value; render(); return; }
  if(k==='fotoval'){ S.foto.vals[el.dataset.pos]=el.value; render(); return; }
  if(k==='fotofecha'){ S.foto.fecha=el.value.trim(); render(); return; }
  if(k==='fotocierra'){ S.foto.cierra=el.value; return; }
  if(k==='fcat'){ S.f.cat=el.value; S.f.limit=80; render(); return; }
  if(k==='fmonth'){ S.f.month=+el.value; S.f.limit=80; render(); return; }
  if(k==='e-cat'){ entryTouched=true; return; }
});
document.addEventListener('input',e=>{ if(e.target.dataset&&e.target.dataset.inp==='q'){ S.f.q=e.target.value; S.f.limit=80; $('#movlist').innerHTML=movListHTML(); } });
document.addEventListener('focusout',e=>{ if(e.target.id==='e-txt'&&!entryTouched){ const t=e.target.value.trim(); if(!t) return; const c=classify(t,makeCtx()); if(c.cat){ const sel=$('#e-cat'); if([...sel.options].some(o=>o.value===c.cat)) sel.value=c.cat; } } });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.closest&&e.target.closest('#dlg')&&e.target.tagName==='INPUT'){ e.preventDefault(); if($('#i-val')) saveIncome(); else if($('#e-amt')) saveEntry(); } });

/* ================= arranque ================= */
const dlgOpen=()=>{ const d=$('#dlg'); return d&&d.open; };
async function init(){
  window.addEventListener('hashchange',()=>render(true));
  window.addEventListener('online',()=>{ flush(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.cfg&&!S.outbox.length&&!dlgOpen()){ pull().then(ok=>{ if(ok&&!dlgOpen()&&!['nuevo','foto','mes'].includes(parseHash().name)) render(); }); } });
  render(true);
  if(S.cfg){
    setSync();
    if(S.db){ flush(); pull().then(ok=>{ if(ok&&!dlgOpen()&&!['nuevo','foto','mes'].includes(parseHash().name)) render(); }); }
    else { await pull(); render(true); }
  }
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();

</script>
